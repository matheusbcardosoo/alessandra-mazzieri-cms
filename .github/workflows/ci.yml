name: CI

# Gate de qualidade para PRs: testes, typecheck e lint. Complementa o
# lighthouse-ci.yml (regressão de SEO/perf/acessibilidade) — este workflow
# não builda nem sobe o app, só valida o código.

on:
  pull_request:
    branches: [main, master]
    paths:
      - "client/**"
      - "server/**"
      - "server.js"
      - "package.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-placeholder-secret-not-for-prod
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ADMIN_EMAIL: admin@ci.example.com
      ADMIN_PASSWORD: CIPlaceholder123!
      CLIENT_URL: http://localhost:5173
      SITE_URL: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
